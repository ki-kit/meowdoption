# Dev stack for Meowdoption.
# Services are added step by step: db (now), api, web, e2e (later steps).
# Data lives in named volumes, not bind mounts: the project folder is a
# VirtualBox share (vboxsf) with unreliable file locking and symlinks.

services:
  api:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # DB URLs default in code (SQLite). Override per run, e.g.
    #   podman-compose run -e TEST_DATABASE_URL=postgresql+psycopg://... api pytest
    # (podman-compose 1.3 doesn't expand ${VAR:-default} here.)
    environment:
      # vboxsf doesn't emit inotify events, so the reloader must poll.
      WATCHFILES_FORCE_POLLING: "true"
    # The project dir is root:vboxsf 770; keep the host user's vboxsf
    # group inside the container so the bind mount is readable.
    group_add: [keep-groups]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - apidata:/data

  db:
    # Postgres is only needed for test/prod parity; dev uses SQLite.
    image: docker.io/library/postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: meow
      POSTGRES_PASSWORD: meow
      POSTGRES_DB: meowdoption
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meow -d meowdoption"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  apidata:
  pgdata:
