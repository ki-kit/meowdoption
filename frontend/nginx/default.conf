# Production web server: serves the built SPA and proxies the API.
# TLS is expected to terminate in front of this (load balancer / reverse proxy).

upstream api {
    server api:8000;
}

# First line of defence for logins, per client IP: caps floods before they
# reach the API (each login runs a deliberately slow Argon2 hash). The API
# itself limits *failed* attempts per IP and per account.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Largest upload is a 5 MB photo; allow multipart overhead, refuse bigger
    # bodies here instead of streaming them to the API first.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Behind a TLS proxy / load balancer, $remote_addr is that proxy, so every
    # visitor would share one IP (and one login limit). Then trust only your
    # proxy to name the real client:
    #   set_real_ip_from 10.0.0.0/8;    # your proxy's address or range
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;

    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass http://api;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Same shape as the API's own 429, so the login page can show the message.
    location @login_limited {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 60 always;
        default_type application/json;
        return 429 '{"detail": "Too many login attempts. Try again in 1 minute."}';
    }

    # API and media (uploads + default meow). /docs and /openapi.json aren't
    # proxied, so the API docs aren't public in production.
    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /media/ {
        proxy_pass http://api;
        include /etc/nginx/snippets/proxy-headers.conf;
        expires 7d;  # media files never change: new uploads get new names
    }

    # Vite's hashed bundles: the name changes whenever the content does.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the SPA shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";  # always check for a new release
        try_files $uri /index.html;
    }
}
