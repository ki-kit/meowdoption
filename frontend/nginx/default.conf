# Production web server: serves the built SPA and proxies the API.
# TLS is expected to terminate in front of this (load balancer / reverse proxy).

upstream api {
    server api:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Largest upload is a 5 MB photo; allow multipart overhead, refuse bigger
    # bodies here instead of streaming them to the API first.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # API and media (uploads + default meow). /docs and /openapi.json aren't
    # proxied, so the API docs aren't public in production.
    location /api/ {
        proxy_pass http://api;
        # The API sets nosniff itself (for dev without nginx); send it once.
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://api;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        expires 7d;  # media files never change: new uploads get new names
    }

    # Vite's hashed bundles: the name changes whenever the content does.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the SPA shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";  # always check for a new release
        try_files $uri /index.html;
    }
}
