proxy_set_header Host $host;
# Overwrite (don't append to) X-Forwarded-For: a client could otherwise send a
# fake one, and the API's per-IP login limit would count a "new" IP each time.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# The API sets nosniff itself (for dev without nginx); send it once.
proxy_hide_header X-Content-Type-Options;
